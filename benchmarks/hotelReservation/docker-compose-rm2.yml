services:

  mongodb-profile:
    image: mongo:4.4.3
    ports:
      - "27019:27017"   
    volumes:
      - profile:/data/db 
    restart: always
    container_name: hotelreservation_mongodb-profile

  mongodb-rate:
    image: mongo:4.4.3
    ports:
      - "27020:27017"    
    volumes:
      - rate:/data/db
    restart: always
    container_name: hotelreservation_mongodb-rate

  mongodb-recommendation:
    image: mongo:4.4.3
    ports:
      - "27021:27017"    
    volumes:
      - recommendation:/data/db
    restart: always
    container_name: hotelreservation_mongodb-recommendation
    
  mongodb-reservation:
    image: mongo:4.4.3
    ports:
      - "27022:27017"
    volumes:
      - reservation:/data/db 
    restart: always
    container_name: hotelreservation_mongodb-reservation

  mongodb-user:
    image: mongo:4.4.3
    ports:
      - "27023:27017"   
    volumes:
      - user:/data/db
    restart: always
    container_name: hotelreservation_mongodb-user

volumes:
  geo:
  profile:
  rate:
  recommendation:
  reservation:
  user: