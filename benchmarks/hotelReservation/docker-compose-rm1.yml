services:
  frontend:
    image: yz2297/hotel_reservation
    entrypoint: frontend
    ports:
      - "5000:5000"
    volumes:
      - ./config.json:/go/src/github.com/harlow/go-micro-services/config.json
    restart: always
    container_name: hotelreservation_frontend

  recommendation:
    image: yz2297/hotel_reservation
    entrypoint: recommendation
    ports:
      - "8085:8085"
    volumes:
      - ./config.json:/go/src/github.com/harlow/go-micro-services/config.json
    restart: always
    container_name: hotelreservation_recommendation

  user:
    image: yz2297/hotel_reservation
    entrypoint: user
    ports:
      - "8086:8086"
    volumes:
      - ./config.json:/go/src/github.com/harlow/go-micro-services/config.json
    restart: always
    container_name: hotelreservation_user
    
  reservation:
    image: yz2297/hotel_reservation
    entrypoint: reservation
    ports:
      - "8087:8087"
    volumes:
      - ./config.json:/go/src/github.com/harlow/go-micro-services/config.json
    restart: always
    container_name: hotelreservation_reservation

  search:
    image: yz2297/hotel_reservation
    entrypoint: search
    ports:
      - "8082:8082"
    # depends_on:
    #   - jaeger
    #   - consul
    volumes:
      - ./config.json:/go/src/github.com/harlow/go-micro-services/config.json
    restart: always
    container_name: hotelreservation_search

volumes:
  geo:
  profile:
  rate:
  recommendation:
  reservation:
  user: