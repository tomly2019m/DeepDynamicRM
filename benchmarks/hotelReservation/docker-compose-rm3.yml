services:
  memcached-rate:
    image: memcached
    ports:
     - 11212:11211
    environment:
      - MEMCACHED_CACHE_SIZE=2048
      - MEMCACHED_THREADS=8
    restart: always
    container_name: hotelreservation_memcached-rate

  memcached-profile:
    image: memcached
    ports:
     - 11213:11211
    environment:
      - MEMCACHED_CACHE_SIZE=2048
      - MEMCACHED_THREADS=8
    logging:
      options:
        max-size: 50m
    restart: always
    container_name: hotelreservation_memcached-profile

  memcached-reserve:
    image: memcached
    ports:
     - 11214:11211
    environment:
      - MEMCACHED_CACHE_SIZE=2048
      - MEMCACHED_THREADS=8
    restart: always
    container_name: hotelreservation_memcached-reserve

  mongodb-geo:
    image: mongo:4.4.3
    ports:
      - "27018:27017" 
    volumes:
      - geo:/data/db 
    restart: always
    container_name: hotelreservation_mongodb-geo

volumes:
  geo:
  profile:
  rate:
  recommendation:
  reservation:
  user: